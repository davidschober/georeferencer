[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "georeferencer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "flask>=2.0",
    "rasterio>=1.3",
    "pillow>=9.0",
]

[project.optional-dependencies]
pdf = ["pdf2image"]
dev = ["pytest", "pytest-cov"]

[project.scripts]
georef = "georeferencer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/georeferencer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
